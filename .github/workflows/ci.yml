name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project
        run: python -m pip install -e ".[test,dev]"

      - name: Ruff format check
        run: python -m ruff format --check .

      - name: Ruff lint
        run: python -m ruff check .

      - name: mypy
        run: python -m mypy

      - name: pytest with coverage
        run: python -m pytest --cov --cov-config=.coveragerc-core --cov-report=xml --cov-report=term-missing

      - name: Build package
        run: python -m build

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}
          path: coverage.xml

  nautilus-adapter:
    name: pinned Nautilus adapter (Windows CPython 3.13)
    runs-on: windows-latest
    env:
      TEC_NAUTILUS_WHEEL: ${{ github.workspace }}\wheelhouse\nautilus_trader-1.231.0-cp313-cp313-win_amd64.whl
      TEC_NAUTILUS_INTEGRATION_PYTHON: ${{ github.workspace }}\.venv\Scripts\python.exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Download and verify exact wheel
        shell: pwsh
        run: |
          python -m pip download --only-binary=:all: --no-deps nautilus_trader==1.231.0 -d wheelhouse
          $actual = (Get-FileHash -Algorithm SHA256 $env:TEC_NAUTILUS_WHEEL).Hash.ToLowerInvariant()
          $expected = "5fc8e08e98b6a47a5f0104c12ac6d8d3cefa0fd9dd2bb0d211c1b14517ff9aaf"
          if ($actual -ne $expected) { throw "Nautilus wheel SHA-256 mismatch: $actual" }

      - name: Install isolated adapter test environment
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -e ".[test,dev]" $env:TEC_NAUTILUS_WHEEL

      - name: Probe pinned adapter
        shell: pwsh
        run: .\.venv\Scripts\tec.exe adapter nautilus doctor --wheel $env:TEC_NAUTILUS_WHEEL --json

      - name: Adapter tests
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m pytest --cov --cov-report=term-missing

  vectorbt-adapter:
    name: pinned vectorbt stage-zero adapter (CPython 3.13)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Create isolated adapter environment
        shell: pwsh
        run: |
          python -m venv .venv-vectorbt
          .\.venv-vectorbt\Scripts\python.exe -m pip install -c requirements/vectorbt-resolved.txt -e ".[test,dev,security,vectorbt]"

      - name: Prove Rust is absent and probe pins
        shell: pwsh
        run: |
          if (.\.venv-vectorbt\Scripts\python.exe -m pip show vectorbt-rust) { throw "vectorbt-rust must not be installed" }
          .\.venv-vectorbt\Scripts\tec.exe adapter vectorbt doctor --json

      - name: Adapter tests and branch coverage
        shell: pwsh
        run: .\.venv-vectorbt\Scripts\python.exe -m pytest tests/unit tests/adversarial/test_vectorbt_isolation.py tests/cli/test_vectorbt_cli.py tests/integration/test_vectorbt_offline.py -k vectorbt --cov=trading_engine_conformance.adapters.vectorbt --cov-branch --cov-report=term-missing --cov-fail-under=95

      - name: Adapter dependency audit
        shell: pwsh
        run: .\.venv-vectorbt\Scripts\python.exe -m pip_audit
